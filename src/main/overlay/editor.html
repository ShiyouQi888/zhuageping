<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; style-src 'self';" />
    <title>抓个屏截图编辑器</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <canvas id="annotationCanvas"></canvas>
    <div id="shade"></div>
    <div id="selection">
      <i class="handle h1" data-handle="nw"></i>
      <i class="handle h2" data-handle="n"></i>
      <i class="handle h3" data-handle="ne"></i>
      <i class="handle h4" data-handle="e"></i>
      <i class="handle h5" data-handle="se"></i>
      <i class="handle h6" data-handle="s"></i>
      <i class="handle h7" data-handle="sw"></i>
      <i class="handle h8" data-handle="w"></i>
    </div>
    <div id="objectBox">
      <i class="handle h1" data-handle="nw"></i>
      <i class="handle h2" data-handle="n"></i>
      <i class="handle h3" data-handle="ne"></i>
      <i class="handle h4" data-handle="e"></i>
      <i class="handle h5" data-handle="se"></i>
      <i class="handle h6" data-handle="s"></i>
      <i class="handle h7" data-handle="sw"></i>
      <i class="handle h8" data-handle="w"></i>
    </div>

    <div id="toolbar" role="toolbar" aria-label="截图编辑工具">
      <div class="toolbar-section primary-tools" aria-label="绘制工具">
        <button data-tool="select" title="选择/移动 V"><svg viewBox="0 0 24 24"><path d="M5 4l11 8-5 1.4L8.8 19z"/></svg></button>
        <button data-tool="rect" title="矩形 R"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12" rx="2"/></svg></button>
        <button data-tool="ellipse" title="圆形 O"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg></button>
        <button data-tool="line" title="直线 L"><svg viewBox="0 0 24 24"><path d="M6 18L18 6"/></svg></button>
        <button data-tool="arrow" title="箭头 A"><svg viewBox="0 0 24 24"><path d="M6 18L18 6"/><path d="M11 6h7v7"/></svg></button>
        <button data-tool="brush" title="画笔 B"><svg viewBox="0 0 24 24"><path d="M7 19c2.8 0 3.5-1.8 4.7-4"/><path d="M13.5 4.5l6 6-6.8 6.8-6-6z"/></svg></button>
        <button data-tool="text" title="文字 T"><svg viewBox="0 0 24 24"><path d="M5 6h14"/><path d="M12 6v12"/><path d="M8.5 18h7"/></svg></button>
        <button data-tool="mosaic" title="马赛克 M"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
        <button data-tool="blur" title="模糊块 U"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M8 9h8M8 12h8M8 15h8"/></svg></button>
        <button data-tool="eraser" title="橡皮擦 E"><svg viewBox="0 0 24 24"><path d="M4 16l8.5-8.5a3 3 0 0 1 4.2 0l2.8 2.8a3 3 0 0 1 0 4.2L14 20H8z"/><path d="M9 11l6 6"/></svg></button>
        <button id="scrollCapture" title="滚动截图 Ctrl+Shift+F1"><svg viewBox="0 0 24 24"><path d="M8 4h8a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M12 15v4"/><path d="M9.5 16.5L12 19l2.5-2.5"/></svg></button>
      </div>

      <div class="toolbar-section style-tools" aria-label="样式">
        <input id="color" type="color" value="#ef4444" title="自定义颜色" />
        <div id="swatches" aria-label="颜色预设">
          <button class="swatch swatch-red active" data-color="#ef4444" title="红色"></button>
          <button class="swatch swatch-blue" data-color="#2563eb" title="蓝色"></button>
          <button class="swatch swatch-green" data-color="#16a34a" title="绿色"></button>
          <button class="swatch swatch-amber" data-color="#f59e0b" title="黄色"></button>
          <button class="swatch swatch-black" data-color="#111827" title="黑色"></button>
          <button class="swatch swatch-white" data-color="#ffffff" title="白色"></button>
        </div>
        <select id="strokeSize" title="线宽">
          <option value="3">细</option>
          <option value="5" selected>中</option>
          <option value="9">粗</option>
          <option value="15">特粗</option>
        </select>
      </div>

      <div class="toolbar-section object-tools" aria-label="对象操作">
        <button id="duplicateObject" title="复制对象 Ctrl+D"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg></button>
        <button id="bringForward" title="上移一层 Ctrl+]"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M7 10l5-5 5 5"/><path d="M5 19h14"/></svg></button>
        <button id="sendBackward" title="下移一层 Ctrl+["><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M7 14l5 5 5-5"/><path d="M5 5h14"/></svg></button>
        <select id="alignMenu" title="对齐选中对象">
          <option value="">对齐</option>
          <option value="left">左对齐</option>
          <option value="center">水平居中</option>
          <option value="right">右对齐</option>
          <option value="top">顶对齐</option>
          <option value="middle">垂直居中</option>
          <option value="bottom">底对齐</option>
        </select>
      </div>

      <div class="toolbar-section output-tools" aria-label="完成操作">
        <button id="undo" title="撤销 Ctrl+Z"><svg viewBox="0 0 24 24"><path d="M9 7H4v5"/><path d="M4 12a8 8 0 1 0 3-6"/></svg></button>
        <button id="ocrCapture" title="OCR 识别并复制 Ctrl+Shift+O"><svg viewBox="0 0 24 24"><path d="M5 8V6a1 1 0 0 1 1-1h2"/><path d="M16 5h2a1 1 0 0 1 1 1v2"/><path d="M19 16v2a1 1 0 0 1-1 1h-2"/><path d="M8 19H6a1 1 0 0 1-1-1v-2"/><path d="M8 10h8"/><path d="M10 10v6"/><path d="M14 10v6"/><path d="M8 16h8"/></svg></button>
        <button id="copy" title="复制 Ctrl+C"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg></button>
        <button id="pin" title="贴图 F3"><svg viewBox="0 0 24 24"><path d="M9 4h6"/><path d="M12 4v7"/><path d="M7 11h10l-2 5H9z"/><path d="M12 16v5"/></svg></button>
        <button id="save" title="保存 Ctrl+S"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></button>
        <button id="cancel" class="danger" title="取消 Esc"><svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>
        <button id="ok" class="success" title="完成 Enter"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></button>
      </div>
    </div>

    <div id="optionLayer" aria-label="工具参数">
      <div class="toolbar-section text-tools contextual is-hidden" data-context="text" aria-label="文字样式">
        <select id="fontSize" title="文字大小">
          <option value="18">18</option>
          <option value="24" selected>24</option>
          <option value="32">32</option>
          <option value="44">44</option>
          <option value="56">56</option>
        </select>
        <button id="boldText" class="toggle" title="文字加粗"><svg viewBox="0 0 24 24"><path d="M7 5h6a4 4 0 0 1 0 8H7z"/><path d="M7 13h7a4 4 0 0 1 0 8H7z"/><path d="M7 5v16"/></svg></button>
        <button id="textBg" class="toggle" title="文字背景"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h8"/><path d="M8 14h5"/></svg></button>
        <button id="textStroke" class="toggle" title="文字描边"><svg viewBox="0 0 24 24"><path d="M5 19l7-14 7 14"/><path d="M8 14h8"/></svg></button>
      </div>

      <div class="toolbar-section privacy-tools contextual is-hidden" data-context="privacy" aria-label="隐私处理">
        <label class="compact-control" title="马赛克/模糊强度">
          <span>强度</span>
          <input id="privacyStrength" type="range" min="1" max="10" value="5" />
        </label>
      </div>
    </div>

    <div id="bootFlash"></div>
    <div id="status">拖动选择截图区域</div>
    <div id="help">V 选择 · R 矩形 · T 文字 · M 马赛克 · U 模糊 · Ctrl+Shift+O OCR · Ctrl+Shift+F1 滚动截图 · F3 贴图 · Esc 取消 · Ctrl+C 复制 · Enter 完成</div>
    <div id="ocrDialog" aria-modal="true" role="dialog" aria-labelledby="ocrTitle">
      <div class="ocr-card">
        <div class="ocr-header">
          <div>
            <strong id="ocrTitle">OCR 识别结果</strong>
            <span id="ocrMeta">准备就绪</span>
          </div>
          <button id="ocrClose" title="关闭 OCR 结果"><svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>
        </div>
        <textarea id="ocrText" readonly spellcheck="false" placeholder="未识别到文字"></textarea>
        <div class="ocr-footer">
          <span id="ocrTip">识别成功后会自动复制到剪贴板</span>
          <button id="ocrCopy" class="text-button">复制文字</button>
        </div>
      </div>
    </div>
    <script src="./editor.js"></script>
  </body>
</html>
