<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; style-src 'self';" />
    <title>抓个屏录屏</title>
    <link rel="stylesheet" href="./recorder.css" />
  </head>
  <body>
    <div id="shade"></div>
    <div id="selection"></div>
    <div id="recordingFrame" aria-hidden="true"></div>
    <div id="edgeReveal" aria-hidden="true"></div>
    <div id="sizeBadge">0 x 0</div>
    <div id="selectionHint">
      <span id="selectionHintText"></span>
      <button id="selectionCancel" type="button">取消</button>
    </div>
    <div id="countdown" aria-live="assertive"></div>
    <div id="controlBar" role="toolbar" aria-label="录屏控制">
      <div class="recording-summary">
        <span class="recording-state"><span id="statusDot"></span><span>REC</span></span>
        <strong id="timer">00:00</strong>
        <span id="controlSize">0 x 0</span>
      </div>
      <div class="recording-actions">
        <button id="pause" class="icon-button" type="button"><span aria-hidden="true">Ⅱ</span></button>
        <button id="stop" class="icon-button stop-button" type="button"><span aria-hidden="true">■</span></button>
        <button id="cancel" class="icon-button close-button" type="button"><span aria-hidden="true">×</span></button>
      </div>
    </div>
    <video id="screenVideo" muted playsinline></video>
    <script src="./recorder.js"></script>
  </body>
</html>
